<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Comando Fênix - Enterprise v6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-20">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- Header -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold text-blue-400">🔥 Fênix Enterprise</h1>
                <p class="text-xs text-slate-400">Cloud Ecosystem & Hub v6</p>
            </div>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded border border-emerald-500/20 animate-pulse">Online</span>
        </div>

        <!-- Estatísticas & Gráfico -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-2">
            <h2 class="text-sm font-semibold text-amber-400">📊 Desempenho de Vendas</h2>
            <div class="h-32"><canvas id="salesChart"></canvas></div>
            <p class="text-xs text-slate-300 text-center font-medium" id="stats-info">A sincronizar estatísticas...</p>
        </div>

        <!-- 1. NOVO: Monitor PM2 / Termux -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-2">
            <h2 class="text-sm font-semibold text-violet-400">⚡ Monitor de Processos (Termux/PM2)</h2>
            <div id="pm2-container" class="space-y-1.5 text-xs">
                <div class="bg-slate-950 p-2 rounded border border-slate-800 text-slate-400">A carregar processos...</div>
            </div>
            <button onclick="carregarPM2()" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-medium py-1.5 rounded-lg text-xs transition">Atualizar Status de Servidores</button>
        </div>

        <!-- 2. NOVO: Assistente IA / Gemini Integrado -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-3">
            <h2 class="text-sm font-semibold text-cyan-400">🤖 Assistente IA & Marketing KDP</h2>
            <input type="text" id="ia-prompt" placeholder="Ex: Ideias de capítulos para livro de ficção..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
            <div class="flex gap-2">
                <button onclick="executarIA('conteudo')" class="w-1/2 bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-1.5 rounded-lg text-xs transition">Gerar Ideias</button>
                <button onclick="executarIA('marketing')" class="w-1/2 bg-teal-600 hover:bg-teal-500 text-white font-medium py-1.5 rounded-lg text-xs transition">Estratégia Vendas</button>
            </div>
            <div id="ia-resultado" class="hidden text-xs bg-slate-950 p-2.5 rounded border border-slate-800 text-slate-300 whitespace-pre-line leading-relaxed max-h-40 overflow-y-auto"></div>
        </div>

        <!-- 3. NOVO: Editor Markdown Pro com Pré-visualização -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-3">
            <h2 class="text-sm font-semibold text-pink-400">📝 Editor Markdown & Notas KDP</h2>
            <textarea id="markdown-input" placeholder="# Título do Capítulo&#10;Escreve em Markdown aqui..." class="w-full h-24 bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 resize-none font-mono"></textarea>
            <div class="flex gap-2">
                <button onclick="salvarMarkdown()" class="w-1/2 bg-pink-600 hover:bg-pink-500 text-white font-medium py-1.5 rounded-lg text-xs transition">Salvar Nota</button>
                <button onclick="alternarPreview()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-1.5 rounded-lg text-xs transition">Pré-visualizar</button>
            </div>
            <div id="markdown-preview" class="hidden text-xs bg-slate-950 p-2.5 rounded border border-slate-800 text-slate-300 space-y-1 font-sans"></div>
        </div>

        <!-- 4. Checkout Mercado Pago -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-3">
            <h2 class="text-sm font-semibold text-emerald-400">🛒 Checkout Mercado Pago</h2>
            <input type="text" id="produto-nome" value="E-book KDP Avançado" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
            <input type="number" id="produto-preco" value="49.00" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
            <button onclick="comprarAgora()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-xs transition">Gerar Pagamento Real</button>
        </div>

        <!-- 5. Gerador de Tokens & Chaves API -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-2">
            <h2 class="text-sm font-semibold text-indigo-400">🔑 Gerador de Tokens & Chaves API</h2>
            <button onclick="gerarTokenSeguro()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-xs transition">Gerar Chave Segura</button>
            <div id="token-box" class="hidden text-xs bg-slate-950 p-2 rounded border border-slate-800 text-indigo-300 font-mono break-all select-all"></div>
        </div>

    </div>

    <script>
        let myChart = null;

        function initChart(vendasHoje) {
            const ctx = document.getElementById('salesChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Hoje'],
                    datasets: [{ label: 'Vendas', data: [1, 2, 1, 3, 2, 4, vendasHoje], backgroundColor: '#3b82f6', borderRadius: 4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#1e293b' } }, x: { grid: { display: false } } } }
            });
        }

        async function carregarEstatisticas() {
            try {
                const res = await fetch('/api/vendas/stats');
                const data = await res.json();
                const totalFormatado = Number(data.faturamentoTotal || 0).toFixed(2).replace('.', ',');
                document.getElementById('stats-info').innerHTML = `Hoje: <span class="text-amber-400">${data.vendasHoje || 0} vendas</span> | Total: <span class="text-emerald-400">R$ ${totalFormatado}</span>`;
                initChart(data.vendasHoje || 0);
            } catch (e) {
                document.getElementById('stats-info').innerText = "Modo autónomo ativo.";
                initChart(4);
            }
        }

        async function carregarPM2() {
            const container = document.getElementById('pm2-container');
            container.innerHTML = `<div class="bg-slate-950 p-2 rounded border border-slate-800 text-slate-400">A verificar processos...</div>`;
            try {
                const res = await fetch('/api/pm2/status');
                const data = await res.json();
                container.innerHTML = '';
                data.processes.forEach(p => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center bg-slate-950 p-2 rounded border border-slate-800 text-slate-300";
                    div.innerHTML = `<span>🟢 ${p.name}</span> <span class="text-[10px] text-violet-400">Mem: ${p.memory} | CPU: ${p.cpu}</span>`;
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = `<div class="bg-slate-950 p-2 rounded border border-slate-800 text-rose-400">Erro ao carregar processos PM2.</div>`;
            }
        }

        async function executarIA(acao) {
            const prompt = document.getElementById('ia-prompt').value;
            const resBox = document.getElementById('ia-resultado');
            if (!prompt) {
                alert("Escreve um tópico para a IA.");
                return;
            }
            resBox.classList.remove('hidden');
            resBox.innerText = "A consultar inteligência artificial...";
            try {
                const res = await fetch('/api/ia/processar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, acao })
                });
                const data = await res.json();
                resBox.innerText = data.resultado;
            } catch (e) {
                resBox.innerText = "Erro ao comunicar com o serviço de IA.";
            }
        }

        function salvarMarkdown() {
            const texto = document.getElementById('markdown-input').value;
            localStorage.setItem('fenix_markdown', texto);
            alert("Nota Markdown guardada com sucesso!");
        }

        function alternarPreview() {
            const preview = document.getElementById('markdown-preview');
            const input = document.getElementById('markdown-input');
            preview.classList.toggle('hidden');
            if (!preview.classList.contains('hidden')) {
                // Simples conversor visual de Markdown para HTML básico
                let html = input.value
                    .replace(/^# (.*$)/gm, '<h1 class="text-sm font-bold text-pink-400">$1</h1>')
                    .replace(/^## (.*$)/gm, '<h2 class="text-xs font-bold text-pink-300">$1</h2>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\n/g, '<br>');
                preview.innerHTML = html || "<em>Sem conteúdo para visualizar.</em>";
            }
        }

        async function comprarAgora() {
            const titulo = document.getElementById('produto-nome').value;
            const preco = document.getElementById('produto-preco').value;
            try {
                const res = await fetch('/api/pagar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titulo, preco })
                });
                const data = await res.json();
                if (data.init_point) window.location.href = data.init_point;
                else alert("Erro ao gerar link.");
            } catch (e) {
                alert("Erro de conexão.");
            }
        }

        function gerarTokenSeguro() {
            const array = new Uint8Array(24);
            crypto.getRandomValues(array);
            const token = Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
            const box = document.getElementById('token-box');
            box.classList.remove('hidden');
            box.innerText = `fnx_live_${token}`;
        }

        window.onload = () => {
            const salvo = localStorage.getItem('fenix_markdown');
            if(salvo) document.getElementById('markdown-input').value = salvo;
            carregarEstatisticas();
            carregarPM2();
        };
    </script>
</body>
</html>
